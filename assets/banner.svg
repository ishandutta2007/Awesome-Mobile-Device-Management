<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-icon {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/>

  <!-- Dynamic / Animated Background Elements -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" class="pulse-circle" opacity="0.25" style="transform-origin: 200px 150px;"/>
  <circle cx="1000" cy="100" r="140" fill="#a855f7" class="pulse-circle" opacity="0.2" style="transform-origin: 1000px 100px; animation-delay: 2s;"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 200 0 L 200 300 M 400 0 L 400 300 M 600 0 L 600 300 M 800 0 L 800 300 M 1000 0 L 1000 300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Floating Tech / Device Icons (Background side details) -->
  <g class="float-icon" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4">
    <!-- Phone icon left -->
    <rect x="110" y="90" width="45" height="85" rx="8"/>
    <line x1="128" y1="98" x2="137" y2="98"/>
    <circle cx="132.5" cy="165" r="3"/>

    <!-- Laptop icon right -->
    <rect x="1030" y="140" width="70" height="45" rx="4" stroke="#c084fc"/>
    <path d="M 1015 185 L 1115 185" stroke="#c084fc"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#title-grad)" filter="url(#glow)">
      Awesome Mobile Device Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0" letter-spacing="1">
      Curated List of SaaS Platforms &amp; Open-Source MDM / UEM Solutions
    </text>

    <!-- Tagline Badges Text -->
    <text x="600" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">
      📱 iOS &amp; Android • 💻 macOS &amp; Windows • 🛡️ Endpoint Compliance &amp; Kiosk Fleet Control
    </text>
  </g>
</svg>
